name: Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # SERVER QUALITY GATE
  # ==========================================
  server-checks:
    name: Server - Quality & Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/ci-db"

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate

      - name: Apply Migrations to Fresh Database
        run: pnpm exec prisma migrate deploy

      - name: Check Schema Matches Migrations
        run: pnpm exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code

      - name: Check Prettier Formatting
        run: pnpm run format:check

      - name: Run Linter
        run: pnpm run lint

      - name: Verify TypeScript Compilation
        run: pnpm run build

  # ==========================================
  # CLIENT QUALITY GATE
  # ==========================================
  client-checks:
    name: Client - Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prettier Formatting & Tailwind Ordering
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Verify Next.js Production Build
        run: pnpm run build
