name: Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # SERVER QUALITY GATE
  # ==========================================
  server-checks:
    name: Server - Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./server/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mock-db"

      - name: Run Linter
        run: npm run lint

      - name: Verify TypeScript Compilation
        run: npm run build

  # ==========================================
  # CLIENT QUALITY GATE (New Addition)
  # ==========================================
  client-checks:
    name: Client - Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "./client/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Check Prettier Formatting & Tailwind Ordering
        run: npm run format:check

      - name: Run ESLint
        run: npm run lint

      - name: Verify Next.js Production Build
        run: npm run build
