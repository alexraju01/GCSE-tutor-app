name: Continuous Integration

on:
  pull_request:
    branches: [main]

jobs:
  # ==========================================
  # SERVER QUALITY GATE
  # ==========================================
  server-checks:
    name: Server - Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "./server/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/mock-db"

      - name: Run Linter
        run: pnpm run lint

      - name: Verify TypeScript Compilation
        run: pnpm run build

  # ==========================================
  # CLIENT QUALITY GATE
  # ==========================================
  client-checks:
    name: Client - Quality & Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ./client

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: "./client/pnpm-lock.yaml"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Prettier Formatting & Tailwind Ordering
        run: pnpm run format:check

      - name: Run ESLint
        run: pnpm run lint

      - name: Verify Next.js Production Build
        run: pnpm run build
